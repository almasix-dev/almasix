<svg xmlns="http://www.w3.org/2000/svg" viewBox="112 86 288 288" fill="none" role="img" aria-label="Almasix">
  <defs>
    <linearGradient id="left" x1="140.4" y1="88" x2="256.0" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7A4D"/>
      <stop offset="1" stop-color="#F1511B"/>
    </linearGradient>
    <linearGradient id="right" x1="256.0" y1="88" x2="343.1" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1511B"/>
      <stop offset="1" stop-color="#B83208"/>
    </linearGradient>
    <linearGradient id="bar" x1="256" y1="232" x2="256" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E3F3FB" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#6BB0D9" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#4A9BC9" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="bar-glass" x1="256" y1="232" x2="256" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="diamond-glow" x="-120%" y="-120%" width="340%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feFlood flood-color="#6BB0D9" flood-opacity="0.8" result="flood"/>
      <feComposite in="flood" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cap" x1="256.0" y1="100" x2="256.0" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
