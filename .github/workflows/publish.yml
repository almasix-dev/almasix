name: Publish

# Releases Almasix to PyPI with Trusted Publishing (OIDC) — no API tokens are
# stored in this repository. PyPI mints a short-lived credential for the job
# based on the `environment:` below, so those names must match the publisher
# configured at https://pypi.org/manage/project/almasix/settings/publishing/.
#
# Cutting a release:      publish a GitHub Release on a `vX.Y.Z` tag.
# Rehearsing a release:   Actions → Publish → Run workflow → target: testpypi.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build + check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      # Catches a README that PyPI would refuse to render, which cannot be
      # fixed after upload because a version number is never reusable.
      - name: Validate metadata
        run: |
          pip install twine
          twine check --strict dist/*

      # A release tagged v0.1.0 must not ship 0.2.0.
      - name: Tag must match the packaged version
        if: github.event_name == 'release'
        run: |
          packaged=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tagged="${GITHUB_REF_NAME#v}"
          echo "packaged=$packaged tagged=$tagged"
          if [ "$packaged" != "$tagged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $packaged"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  verify:
    name: Install the wheel and scaffold an app
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Installs the built artifact rather than the source tree, so a missing
      # stub, template or exception view fails here instead of on a user's machine.
      - name: Install the wheel
        run: pip install dist/*.whl

      - name: Package data is present
        run: |
          python - <<'PY'
          import pathlib, almasix
          root = pathlib.Path(almasix.__file__).parent
          for label, rel in [
              ("stubs", "console/stubs"),
              ("exception views", "exceptions/views"),
              ("py.typed", "py.typed"),
          ]:
              target = root / rel
              assert target.exists(), f"missing {label}: {target}"
              print(f"{label}: ok")
          PY

      # Installing the framework must publish the installer and nothing else.
      # `smith` drives a single application, so a global install — `pipx install
      # almasix` especially — must not put it on PATH.
      - name: Only `almasix` is a global command
        run: |
          command -v almasix
          if command -v smith; then
            echo "::error::Installing the framework put 'smith' on PATH; it belongs to a scaffolded app"
            exit 1
          fi
          echo "almasix is global, smith is not."

      - name: Installer scaffolds a working application
        run: |
          almasix new blog
          cd blog
          # The root script works without installing anything.
          python smith list
          # Installing the app is what provides the bare `smith` command.
          pip install -e .
          smith list
          smith migrate

  testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/almasix/
    permissions:
      id-token: write  # mints the OIDC token Trusted Publishing exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Rehearsals get re-run against a version that may already be there.
          skip-existing: true

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/almasix/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
