name: Docs

# Builds the Starlight site in website/. Deploy is Cloudflare Workers Builds
# connected to this repo (root: website/, build: npm ci && npm run build,
# deploy: npx wrangler deploy) — same pattern as almasix-website.
# No CLOUDFLARE_API_TOKEN in GitHub secrets.
#
# First-time cutover (dashboard):
#   1. Workers & Pages → create/connect project `almasix-docs` to this repo
#   2. Root directory: website/ ; build: npm ci && npm run build ; deploy: npx wrangler deploy
#   3. Custom domain: docs.almasix.com (proxied)
#   4. Remove grey-cloud docs CNAME → almasix-dev.github.io once Active
#   5. Disable GitHub Pages for this repo

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: No legacy /almasix/ base path in links
        run: |
          stray=$(grep -rhoE '(href|src)="/almasix(/|")' --include='*.html' dist || true)
          if [ -n "$stray" ]; then
            echo "::error::Links still use the legacy /almasix base path:"
            echo "$stray" | sort | uniq -c | sort -rn
            exit 1
          fi
          echo "No legacy /almasix/ link prefixes."
