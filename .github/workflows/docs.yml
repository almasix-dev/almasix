name: Docs

# Builds the Starlight site in website/ and deploys it to GitHub Pages at
# https://docs.almasix.com/ (custom domain; github.io remains a fallback origin).
#
# The published site tracks main: it deploys on every merge, so documentation
# reaches readers as soon as it is written rather than waiting for a release.
# Pull requests build without deploying, so broken docs are caught before they
# reach the site, and workflow_dispatch allows an out-of-band refresh.
#
# Requires the repository's Pages source to be set to "GitHub Actions" and the
# custom domain docs.almasix.com configured in the Pages settings.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Let a running deploy finish rather than publishing a half-written site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      # Authenticated so the star badge survives the shared Actions IP quota;
      # SocialIcons memoizes to one api.github.com call per build.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      # Site is at the domain root. Fail if the old GitHub Pages subpath
      # (`/almasix/` or `/almasix`) leaks into href/src. Asset names like
      # /almasix-banner-*.svg are fine — only the path segment counts.
      - name: No legacy /almasix/ base path in links
        run: |
          stray=$(grep -rhoE '(href|src)="/almasix(/|")' --include='*.html' dist || true)
          if [ -n "$stray" ]; then
            echo "::error::Links still use the legacy /almasix base path:"
            echo "$stray" | sort | uniq -c | sort -rn
            exit 1
          fi
          echo "No legacy /almasix/ link prefixes."

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
