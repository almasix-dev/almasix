name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint + format (ruff)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff version pin
        run: python -c "import importlib.metadata as m; v=m.version('ruff'); assert v=='0.16.6', v"

      - name: Lint + format
        run: |
          ruff check src tests
          ruff format --check src tests

  smoke:
    name: Smoke (regression gate)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Smoke tests
        run: pytest -q tests/smoke -m smoke

  test:
    name: Unit + coverage ≥98%
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Full suite with coverage
        run: >
          pytest -q
          --cov=almasix
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  regression:
    name: Regression contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Regression suite
        run: pytest -q -m regression

  # M44 — claimed engines must execute, not only compile.
  orm-engines:
    name: ORM engines (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sqlite
          - engine: pgsql
            db_port: "5432"
          - engine: mysql
            db_port: "3306"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: almasix
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: almasix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U almasix -d almasix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: almasix
          MYSQL_PASSWORD: secret
          MYSQL_DATABASE: almasix_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ualmasix -psecret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev,pgsql,mysql]"

      - name: Dialect conformance
        env:
          ALMASIX_TEST_DB: ${{ matrix.engine }}
          DB_HOST: 127.0.0.1
          DB_USERNAME: almasix
          DB_PASSWORD: secret
          DB_DATABASE: almasix_test
          DB_PORT: ${{ matrix.db_port }}
        run: pytest -q tests/test_m44_conformance.py

  editors-vscode:
    name: Package VS Code VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Package extension
        run: |
          cd editors/vscode
          npm install
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: almasix-vscode-vsix
          path: editors/vscode/*.vsix

  editors-jetbrains:
    name: Package JetBrains plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: buildPlugin
        working-directory: editors/jetbrains
        run: ./gradlew buildPlugin --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: almasix-jetbrains-zip
          path: editors/jetbrains/build/distributions/*.zip
