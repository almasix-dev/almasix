name: Documentation
description: Docs gap or error.
title: "docs: "
labels: ["documentation", "needs-triage"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL or repo path
      placeholder: https://docs.almasix.com/
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What needs fixing?
      description: Missing, wrong, or unclear — plus the fix if you know it.
      render: markdown
    validations:
      required: true
