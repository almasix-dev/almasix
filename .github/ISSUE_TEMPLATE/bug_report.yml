name: Bug report
description: Something isn't working.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: Almasix version
      description: `pip show almasix` → e.g. 0.6.0
    validations:
      required: true
  - type: textarea
    id: bug
    attributes:
      label: Bug
      description: What you did, what happened, what you expected. Minimal repro if you have it.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      render: shell
    validations:
      required: false
