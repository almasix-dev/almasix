<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ status }} — {{ name }}</title>
  <style>
    :root { --brand:#f1511b; }
    body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:#f8f9fa;color:#212529}
    main{text-align:center;padding:2rem;max-width:28rem}
    .code{margin:0;font-size:3.25rem;font-weight:600;color:var(--brand)}
    p{margin:.75rem 0 0;color:#6c757d}
    a{color:var(--brand);font-weight:600}
  </style>
</head>
<body>
  <main>
    <p class="code">{{ status }}</p>
    <p>{{ message }}</p>
    <p><a href="/">Back to {{ name }}</a></p>
  </main>
</body>
</html>
