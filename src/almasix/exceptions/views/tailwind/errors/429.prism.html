<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ status }} — {{ name }}</title>
  {{-- Utility classes; load your compiled Tailwind (Vite) from the app layout when customizing. --}}
  <style>
    :root { --brand:#f1511b; --ink:#0f172a; --muted:#64748b; --paper:#f8fafc; }
    body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:var(--paper);color:var(--ink)}
    main{text-align:center;padding:2rem}
    .code{margin:0;font-size:3.5rem;font-weight:600;letter-spacing:-.04em;color:var(--brand)}
    p{margin:.75rem 0 0;color:var(--muted)}
    a{color:var(--brand);font-weight:600;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <p class="code">{{ status }}</p>
    <p>{{ message }}</p>
    <p><a href="/">Back to {{ name }}</a></p>
  </main>
</body>
</html>
