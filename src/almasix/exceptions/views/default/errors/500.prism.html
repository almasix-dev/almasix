<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ status }} — {{ name }}</title>
  <style>
    :root { color-scheme: light dark; --brand:#f1511b; --ink:#1a1d23; --muted:#5b6575; --paper:#f6f7f9; }
    body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:var(--paper);color:var(--ink)}
    main{text-align:center;padding:2rem}
    h1{margin:0;font-size:3.5rem;letter-spacing:-.04em;color:var(--brand)}
    p{margin:.75rem 0 0;color:var(--muted)}
    a{color:var(--brand);font-weight:600}
  </style>
</head>
<body>
  <main>
    <h1>{{ status }}</h1>
    <p>{{ message }}</p>
    <p><a href="/">Back to {{ name }}</a></p>
  </main>
</body>
</html>
