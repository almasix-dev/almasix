[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almasix"
version = "0.1.0"
description = "Laravel-inspired Python web framework with Adonis-class DX on FastAPI/Starlette"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Almasix Contributors" }]
keywords = ["almasix", "web", "framework", "fastapi", "laravel", "adonis"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "typer>=0.12.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "Babel>=2.14",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "bcrypt>=4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "argon2-cffi>=23.0",
    "ipython>=8.18",
    "redis>=5",
]
pgsql = ["asyncpg>=0.29"]
mysql = ["aiomysql>=0.2"]
mariadb = ["aiomysql>=0.2"]
sqlsrv = ["aioodbc>=0.5.0"]
oracle = ["oracledb>=2.0"]
# Laravel first-party set + optional Oracle (community niche, like yajra/laravel-oci8).
db = ["asyncpg>=0.29", "aiomysql>=0.2", "aioodbc>=0.5.0", "oracledb>=2.0"]
argon2 = ["argon2-cffi>=23.0"]
prism = []
# Tinker-class REPL (`smith loupe` / `tinker` / `repl`) — colors, completion, pretty repr.
loupe = ["ipython>=8.18"]
s3 = ["boto3>=1.34"]
redis = ["redis>=5"]

[project.scripts]
almasix = "almasix.installer.cli:app"
smith = "almasix.smith.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/almasix"]

[tool.hatch.build.targets.wheel.force-include]
"src/almasix/exceptions/views" = "almasix/exceptions/views"
"src/almasix/console/stubs" = "almasix/console/stubs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
# Coverage is opt-in so `pytest tests/smoke` stays a clean gate.
# Full suite with coverage: `pytest -q --cov=almasix --cov-report=term-missing --cov-report=xml`
# (fail_under=98 comes from [tool.coverage.report]; aim for 100% on active packages)
markers = [
    "smoke: end-to-end smoke gates for the current milestones",
    "regression: locks public contracts against accidental breakage",
]

[tool.coverage.run]
branch = true
source = ["almasix"]

[tool.coverage.report]
fail_under = 98
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.pylint.main]
ignore-paths = ["\\.venv", "build", "dist"]

[tool.pylint.basic]
# Model meta (`fillable`, `casts`, `timestamps`) is snake_case by design, not UPPER_CASE.
class-attribute-rgx = "([a-z_][a-z0-9_]*|[A-Z_][A-Z0-9_]*)$"
attr-rgx = "([a-z_][a-z0-9_]*|[A-Z_][A-Z0-9_]*)$"
