[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almasix"
version = "0.5.0"
description = "Laravel-inspired Python web framework with Adonis-class DX on FastAPI/Starlette"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Almasix Contributors" }]
keywords = ["almasix", "web", "framework", "fastapi", "laravel", "adonis"]
# No "License ::" classifier: PEP 639 forbids pairing one with the SPDX `license` field above.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "typer>=0.12.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "Babel>=2.14",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "bcrypt>=4.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://almasix-dev.github.io/almasix"
Documentation = "https://almasix-dev.github.io/almasix"
Repository = "https://github.com/almasix-dev/almasix"
Issues = "https://github.com/almasix-dev/almasix/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "ruff==0.16.6",
    "argon2-cffi>=23.0",
    "ipython>=8.18",
    "redis>=5",
    "pygls>=2.0.0,<3",
    "lsprotocol>=2024.0.0",
]
pgsql = ["asyncpg>=0.29"]
mysql = ["aiomysql>=0.2"]
mariadb = ["aiomysql>=0.2"]
sqlsrv = ["aioodbc>=0.5.0"]
oracle = ["oracledb>=2.0"]
# Document stores. Articulate's memory store needs nothing; Mongo needs Motor.
mongodb = ["motor>=3.5"]
# Laravel first-party set + optional Oracle (community niche, like yajra/laravel-oci8).
db = ["asyncpg>=0.29", "aiomysql>=0.2", "aioodbc>=0.5.0", "oracledb>=2.0"]
argon2 = ["argon2-cffi>=23.0"]
prism = []
# Signet personal access tokens + SPA cookie auth (M37). In-tree; no extra deps.
tokens = []
signet = []
# Tinker-class REPL (`smith loupe` / `tinker` / `repl`) — colors, completion, pretty repr.
loupe = ["ipython>=8.18"]
s3 = ["boto3>=1.34"]
redis = ["redis>=5"]
# Language server (`almasix-lsp` / `python -m almasix.lsp` / `smith lsp:serve`).
lsp = ["pygls>=2.0.0,<3", "lsprotocol>=2024.0.0"]

[project.scripts]
# Only the installer is global. `smith` drives one application, so a scaffolded
# app declares it in its own pyproject and it appears in that project's
# environment — installing the framework with pipx must not put it on PATH.
almasix = "almasix.installer.cli:app"
almasix-lsp = "almasix.lsp.cli:main"

[tool.hatch.build.targets.wheel]
# Stubs and exception views live inside the package and are tracked, so hatchling
# ships them with the package tree; force-including them would double-add them.
packages = ["src/almasix"]

[tool.hatch.build.targets.sdist]
# Enough to build the package and run its suite from source. The Astro site and
# editor config are not part of the Python build.
# Patterns are gitignore-style, so they must be anchored with a leading slash:
# a bare "docs" would also drag in website/src/content/docs.
include = [
    "/src/almasix",
    "/tests",
    "/docs",
    "/examples",
    "/smith",
    "/Makefile",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
# Hatchling honours only the root .gitignore, so the example's local database
# (ignored by examples/progress/.gitignore) must be excluded explicitly.
exclude = [
    "**/*.sqlite",
    "**/*.sqlite3",
    "**/*.db",
    "**/__pycache__",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", ".", "packages/courier/src"]
# Coverage is opt-in so `pytest tests/smoke` stays a clean gate.
# Full suite with coverage: `pytest -q --cov=almasix --cov-report=term-missing --cov-report=xml`
# (fail_under=98 comes from [tool.coverage.report]; aim for 100% on active packages)
markers = [
    "smoke: end-to-end smoke gates for the current milestones",
    "regression: locks public contracts against accidental breakage",
]

[tool.coverage.run]
branch = true
source = ["almasix"]

[tool.coverage.report]
fail_under = 98
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Explicit selection — do not inherit ruff's moving default (M51).
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes
    "I",               # isort
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "RUF100",          # unused `# noqa` — suppressions must earn their keep
]
ignore = [
    "E731",   # lambda assignment — blueprint / query DSLs assign callables
    "UP042",  # str enum — leave existing Enum subclasses alone
    "B008",   # function-call defaults — FastAPI / Typer Depends patterns
]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are imported so the name is in scope, then reappear as
# parameters; that shadowing is the fixture injection pattern, not a bug.
"tests/**" = ["F811", "B017", "B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pylint.main]
ignore-paths = ["\\.venv", "build", "dist"]

[tool.pylint.basic]
# Model meta (`fillable`, `casts`, `timestamps`) is snake_case by design, not UPPER_CASE.
class-attribute-rgx = "([a-z_][a-z0-9_]*|[A-Z_][A-Z0-9_]*)$"
attr-rgx = "([a-z_][a-z0-9_]*|[A-Z_][A-Z0-9_]*)$"
